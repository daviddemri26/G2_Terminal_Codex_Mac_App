name: Verify bridge and Mac app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and run isolated tests
        run: npm run check
      - name: Build local Mac application
        run: bash scripts/build-app.sh
      - name: Check native status and command handling
        run: bash macos/tests/run.sh
      - name: Verify repository formatting
        run: git diff --check
